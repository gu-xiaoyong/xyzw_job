name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构件一：前端（nginx 托管 dist，:latest 方便别人一条命令直接跑）
      # 注意：GHCR 镜像名强制小写，GITHUB_TOKEN 只能写仓库所有者自己的命名空间
      # （fork 后不能推上游 senpewang 的包），gu-xiaoyong 本身为小写，故直接硬编码。
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/gu-xiaoyong/xyzw_web_helper:latest
            ghcr.io/gu-xiaoyong/xyzw_web_helper:latest-web

      # 构件二：后端（render-backend，仅内网端口，需配合 web 使用）
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ghcr.io/gu-xiaoyong/xyzw_web_helper:latest-api
